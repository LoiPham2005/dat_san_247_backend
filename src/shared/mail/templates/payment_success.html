<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px 8px 0 0;
        }

        .content {
            padding: 20px;
            border: 1px solid #eee;
            border-top: none;
            border-radius: 0 0 8px 8px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }

        .success-icon {
            font-size: 48px;
            color: #4CAF50;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Thanh toán thành công</h1>
    </div>
    <div class="content">
        <p>Chào {{fullName}},</p>
        <p>Giao dịch của bạn đã được thực hiện thành công.</p>
        <div style="background: #e8f5e9; padding: 15px; border-radius: 4px; border-left: 4px solid #4CAF50;">
            <p><strong>Mã giao dịch:</strong> {{txnId}}</p>
            <p><strong>Số tiền:</strong> {{amount}} {{currency}}</p>
            <p><strong>Nội dung:</strong> {{description}}</p>
            <p><strong>Thời gian:</strong> {{timestamp}}</p>
        </div>
        <p>Cảm ơn bạn đã tin dùng dịch vụ của Đặt Sân 247!</p>
    </div>
    <div class="footer">
        <p>&copy; 2024 Đặt Sân 247. Mọi quyền được bảo lưu.</p>
    </div>
</body>

</html>
