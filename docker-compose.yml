services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datsan247_api
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - datsan_network

  db:
    image: postgres:15-alpine
    container_name: datsan247_db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-datsan247}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-datsan247}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - datsan_network

  redis:
    image: redis:7-alpine
    container_name: datsan247_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - datsan_network

networks:
  datsan_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
