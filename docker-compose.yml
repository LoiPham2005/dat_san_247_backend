services:
  nginx:
    image: nginx:alpine
    container_name: datsan247_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
    networks:
      - datsan_network

  api:
    image: ${DOCKERHUB_USERNAME:-datsan247}/datsan247-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datsan247_api
    expose:
      - "3001"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - datsan_network

  db:
    image: postgres:15-alpine
    container_name: datsan247_db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-datsan247}
    # No ports exposed externally for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-datsan247}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - datsan_network

  redis:
    image: redis:7-alpine
    container_name: datsan247_redis
    # No ports exposed externally for security
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - datsan_network

networks:
  datsan_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
